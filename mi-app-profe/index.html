<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi App Profe - Control de Alumnos</title>
  <style>
/* ==========================================================================
   1. VARIABLES Y CONFIGURACIÓN GENERAL
   ========================================================================== */
:root {
    --color-fondo: #f4f6f9;
    --color-principal: #1e3a8a;
    --color-secundario: #3b82f6;
    --color-texto: #334155;
    --color-blanco: #ffffff;
    --color-exito: #16a34a;
    --color-error: #dc2626;
    --borde-radio: 8px;
    --sombra: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    --fuente: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: var(--fuente);
    background-color: var(--color-fondo);
    color: var(--color-texto);
    line-height: 1.6;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    color: var(--color-principal);
    font-size: 2.2rem;
    margin-bottom: 5px;
}

header p {
    color: #64748b;
    font-size: 1.1rem;
}

footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #e2e8f0;
    color: #94a3b8;
    font-size: 0.9rem;
}

.contenedor-principal {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 25px;
}

@media (min-width: 768px) {
    .contenedor-principal {
        grid-template-columns: 1fr 1fr;
    }
    .seccion-lista {
        grid-column: span 2;
    }
}

section {
    background-color: var(--color-blanco);
    padding: 25px;
    border-radius: var(--borde-radio);
    box-shadow: var(--sombra);
}

section h2 {
    color: var(--color-principal);
    font-size: 1.3rem;
    margin-bottom: 20px;
    border-bottom: 2px solid #f1f5f9;
    padding-bottom: 8px;
}

.grupo-input {
    margin-bottom: 15px;
}

.grupo-input label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 0.95rem;
}

.grupo-input input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: var(--borde-radio);
    font-size: 1rem;
    transition: border-color 0.2s;
}

.grupo-input input:focus {
    outline: none;
    border-color: var(--color-secundario);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

button[type="submit"] {
    width: 100%;
    background-color: var(--color-principal);
    color: var(--color-blanco);
    border: none;
    padding: 12px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: var(--borde-radio);
    cursor: pointer;
    transition: background-color 0.2s;
}

button[type="submit"]:hover {
    background-color: var(--color-secundario);
}

.tarjetas-resumen {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    height: calc(100% - 50px);
}

.tarjeta {
    background-color: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: var(--borde-radio);
    padding: 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.tarjeta h3 {
    font-size: 0.9rem;
    text-transform: uppercase;
    color: #64748b;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
}

.tarjeta p {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--color-principal);
}

.lista-estudiantes {
    list-style: none;
}

.alumno-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 12px 18px;
    margin-bottom: 10px;
    border-radius: var(--borde-radio);
    transition: transform 0.15s, box-shadow 0.15s;
}

.alumno-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
}

.alumno-info {
    display: flex;
    flex-direction: column;
}

@media (min-width: 480px) {
    .alumno-info {
        flex-direction: row;
        align-items: center;
        gap: 30px;
    }
}

.alumno-nombre {
    font-weight: 600;
    font-size: 1.1rem;
}

.alumno-nota {
    font-size: 0.95rem;
    padding: 2px 8px;
    border-radius: 4px;
}

.nota-aprobado {
    background-color: #dcfce7;
    color: var(--color-exito);
    font-weight: bold;
}

.nota-reprobado {
    background-color: #fee2e2;
    color: var(--color-error);
    font-weight: bold;
}

.btn-eliminar {
    background: none;
    border: none;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 5px;
    border-radius: 5px;
    transition: background-color 0.2s;
}

.btn-eliminar:hover {
    background-color: #f1f5f9;
}

.lista-vacia {
    text-align: center;
    color: #94a3b8;
    padding: 30px 0;
    font-style: italic;
}
</style>

</head>
<body>

  <!-- Encabezado principal -->
  <header>
    <h1>📚 Control de Alumnos</h1>
    <p>Gestión de notas y rendimiento escolar en tiempo real</p>
  </header>

  <main class="contenedor-principal">
    
    <!-- Sección 1: Formulario de ingreso -->
    <section class="seccion-formulario">
      <h2>Registrar Calificación</h2>
      <form id="formulario-alumno">
        <div class="grupo-input">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
        </div>
        
        <div class="grupo-input">
          <label for="nota">Nota Final (0 - 10):</label>
          <input type="number" id="nota" min="0" max="10" step="0.1" placeholder="Ej. 8.5" required>
        </div>
        
        <button type="submit" id="btn-agregar">Agregar Alumno</button>
      </form>
    </section>

    <!-- Sección 2: Estadísticas rápidas -->
    <section class="seccion-estadisticas">
      <h2>Resumen del Curso</h2>
      <div class="tarjetas-resumen">
        <div class="tarjeta">
          <h3>Total Alumnos</h3>
          <p id="total-alumnos">0</p>
        </div>
        <div class="tarjeta">
          <h3>Promedio General</h3>
          <p id="promedio-grupal">0.0</p>
        </div>
      </div>
    </section>

    <!-- Sección 3: Listado de alumnos -->
    <section class="seccion-lista">
      <h2>Listado de Calificaciones</h2>
      <div class="tabla-contenedor">
        
        <!-- Barra de búsqueda agregada -->
<div class="grupo-input contenedor-buscador">
  <label for="buscador">🔍 Buscar Alumno:</label>
  <input type="text" id="buscador" placeholder="Escribe un nombre para filtrar...">
  <button id="btn-exportar" type="button">📥 Descargar Reporte (Excel/CSV)</button>
</div>

        <ul id="lista" class="lista-estudiantes">
          <!-- Las tarjetas de alumnos se inyectarán aquí dinámicamente desde script.js -->
        </ul>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Mi App Profe - Proyecto de Práctica</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
