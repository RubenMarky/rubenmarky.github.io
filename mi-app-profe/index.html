<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi App Profe - Control de Alumnos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado principal -->
  <header>
    <h1>📚 Control de Alumnos</h1>
    <p>Gestión de notas y rendimiento escolar en tiempo real</p>
  </header>

  <main class="contenedor-principal">
    
    <!-- Sección 1: Formulario de ingreso -->
    <section class="seccion-formulario">
      <h2>Registrar Calificación</h2>
      <form id="formulario-alumno">
        <div class="grupo-input">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
        </div>
        
        <div class="grupo-input">
          <label for="nota">Nota Final (0 - 10):</label>
          <input type="number" id="nota" min="0" max="10" step="0.1" placeholder="Ej. 8.5" required>
        </div>
        
        <button type="submit" id="btn-agregar">Agregar Alumno</button>
      </form>
    </section>

    <!-- Sección 2: Estadísticas rápidas -->
    <section class="seccion-estadisticas">
      <h2>Resumen del Curso</h2>
      <div class="tarjetas-resumen">
        <div class="tarjeta">
          <h3>Total Alumnos</h3>
          <p id="total-alumnos">0</p>
        </div>
        <div class="tarjeta">
          <h3>Promedio General</h3>
          <p id="promedio-grupal">0.0</p>
        </div>
      </div>
    </section>

    <!-- Sección 3: Listado de alumnos -->
    <section class="seccion-lista">
      <h2>Listado de Calificaciones</h2>
      <div class="tabla-contenedor">
        <ul id="lista" class="lista-estudiantes">
          <!-- Las tarjetas de alumnos se inyectarán aquí dinámicamente desde script.js -->
        </ul>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Mi App Profe - Proyecto de Práctica</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
