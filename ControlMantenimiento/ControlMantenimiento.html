<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ControlMantenimiento</title>

<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Cliente de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --ink:#14233b; --navy:#1F4E79; --navy-d:#163a5b; --navy-dd:#0f2942;
  --paper:#f4f1ea; --surface:#ffffff; --line:#e2dccf; --line-d:#d3ccbb;
  --muted:#6b7280; --accent:#e07a3f; --accent-d:#c4652d;
  --ok:#2f8f5b; --okbg:#e6f3ec; --warn:#c0801a; --warnbg:#f8efdc;
  --bad:#c4452f; --badbg:#f7e3df; --idle:#64748b; --idlebg:#e9edf2;
  --r:10px; --shadow:0 1px 2px rgba(20,35,59,.06),0 8px 24px rgba(20,35,59,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--paper);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",monospace;font-size:.86em;letter-spacing:-.2px}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0;line-height:1.1}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}

/* ---------- LOGIN ---------- */
#login{
  min-height:100%;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(circle at 1px 1px, rgba(31,78,121,.10) 1px, transparent 0) 0 0/22px 22px,
    linear-gradient(135deg,var(--navy-dd),var(--navy));
}
.card-login{
  width:100%;max-width:380px;background:var(--surface);border-radius:16px;
  padding:34px 30px;box-shadow:0 30px 70px rgba(0,0,0,.35);
}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brandmark .dot{width:13px;height:13px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.brandmark h1{font-size:20px;font-weight:800;letter-spacing:-.5px}
.card-login p.sub{color:var(--muted);margin:.2rem 0 22px;font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line-d);border-radius:var(--r);
  background:#fcfbf8;transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,78,121,.12)
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:var(--r);padding:11px 16px;font-weight:600;font-size:14.5px;
  background:var(--navy);color:#fff;transition:background .15s,transform .05s;
}
.btn:hover{background:var(--navy-d)} .btn:active{transform:translateY(1px)}
.btn.accent{background:var(--accent)} .btn.accent:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line-d)}
.btn.ghost:hover{background:#fff;border-color:var(--navy)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%}
.linkbtn{background:none;border:none;color:var(--navy);font-weight:600;font-size:13.5px;text-decoration:underline;padding:0}
.msg{font-size:13.5px;padding:9px 11px;border-radius:8px;margin-top:6px}
.msg.err{background:var(--badbg);color:var(--bad)} .msg.ok{background:var(--okbg);color:var(--ok)}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100%;grid-template-columns:236px 1fr}
aside{
  background:var(--navy-dd);color:#cfd9e4;padding:20px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
aside .brandmark{padding:6px 8px 18px} aside .brandmark h1{color:#fff;font-size:18px}
nav.side button{
  width:100%;text-align:left;background:none;border:none;color:#aab8c7;
  padding:10px 12px;border-radius:8px;font-size:14.5px;font-weight:500;display:flex;gap:10px;align-items:center;
}
nav.side button:hover{background:rgba(255,255,255,.06);color:#fff}
nav.side button.active{background:var(--navy);color:#fff}
nav.side button .ic{width:18px;text-align:center;opacity:.9}
aside .spacer{flex:1}
aside .userbox{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;font-size:12.5px;color:#9fb0c2}
aside .userbox .email{color:#fff;font-weight:600;word-break:break-all;margin-bottom:8px;font-size:13px}

main{
  padding:30px 34px 60px;min-width:0;
  background:radial-gradient(circle at 1px 1px, rgba(31,78,121,.055) 1px, transparent 0) 0 0/24px 24px;
}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h2{font-size:27px;font-weight:800;letter-spacing:-.6px}
.head .lead{color:var(--muted);font-size:14px;margin-top:3px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .n{font-family:"Bricolage Grotesque";font-size:30px;font-weight:800;letter-spacing:-1px}
.kpi .l{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.kpi.accent .n{color:var(--accent)}

/* tabla */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel .tbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel .tbar h3{font-size:16px;font-weight:700}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfaf6;
}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbfaf6}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)} .pill.idle{background:var(--idlebg);color:var(--idle)}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;background:#eef1f5;color:var(--navy)}

/* barras de nivel de insumos */
.nivel{display:flex;align-items:center;gap:7px;min-width:0}
.nivel .track{flex:1;min-width:40px;height:8px;border-radius:999px;background:#e7e2d6;overflow:hidden}
.nivel .fill{height:100%;border-radius:999px;transition:width .3s}
.nivel .fill.ok{background:var(--ok)} .nivel .fill.warn{background:var(--warn)} .nivel .fill.bad{background:var(--bad)}
.nivel input[type=number]{width:44px;padding:6px 4px}
.pctsign{color:var(--muted);font-size:12.5px}
.rowacts{display:flex;gap:6px;white-space:nowrap}
.rowacts .iconbtn{padding:5px 9px;font-size:13px}
/* secciones dentro de formularios largos */
.formsec{font-family:"Bricolage Grotesque";font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);margin:18px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.formsec:first-child{margin-top:0}
/* caja de valoración en vivo */
.valbox{background:#fbfaf6;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-top:4px}
.valhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.valhead .score{font-family:"Bricolage Grotesque";font-size:30px;font-weight:800;line-height:1}
.valhead .score small{font-size:14px;color:var(--muted);font-weight:600}
.valdesglose{display:flex;flex-wrap:wrap;gap:5px}
.valchip{font-size:11px;padding:2px 8px;border-radius:6px;background:#eef1f5;color:var(--navy);white-space:nowrap}
.valchip.full{background:var(--okbg);color:var(--ok)} .valchip.med{background:var(--warnbg);color:var(--warn)} .valchip.zero{background:var(--badbg);color:var(--bad)}
.cdot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.18);vertical-align:-1px;margin-right:6px}
.c-Negro{background:#222} .c-Cyan{background:#1aa3d6} .c-Magenta{background:#d6249f}
.c-Amarillo{background:#f2c200} .c-Tricolor{background:linear-gradient(90deg,#1aa3d6,#d6249f,#f2c200)} .c-NA{background:#cbd2da}
.ins-row{display:grid;grid-template-columns:1fr 88px minmax(150px,1.3fr) auto auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ins-row:last-child{border-bottom:none}
.ins-row input{padding:7px 9px;border:1.5px solid var(--line-d);border-radius:8px;width:100%}
/* ocultar flechas del input numérico (cortan el valor en campos angostos) */
.ins-row input[type=number]{text-align:center;-moz-appearance:textfield;appearance:textfield}
.ins-row input[type=number]::-webkit-outer-spin-button,
.ins-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ins-lbl{font-size:13.5px;font-weight:600}
.ins-sub{font-size:11.5px;color:var(--muted)}
.iconbtn{background:none;border:1.5px solid var(--line-d);border-radius:8px;padding:6px 9px;font-size:13px;color:var(--navy)}
.iconbtn:hover{border-color:var(--navy)} .iconbtn.danger{color:var(--bad)} .iconbtn.danger:hover{border-color:var(--bad)}
.btn-ins{background:#eef1f5;color:var(--navy);border:none;border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:600}
.btn-ins:hover{background:#e2e8f0}
@media(max-width:560px){ .ins-row{grid-template-columns:1fr 1fr;gap:8px} }

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,41,66,.45);display:none;place-items:center;padding:20px;z-index:50;backdrop-filter:blur(2px)}
.overlay.show{display:grid}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal .mhead h3{font-size:18px;font-weight:800}
.modal .mbody{padding:20px 22px}
.modal .x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:80;
  transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad)}

@media(max-width:760px){
  #app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  aside .brandmark{padding:6px}
  nav.side{display:flex;flex-wrap:wrap;gap:4px}
  nav.side button{width:auto}
  aside .spacer{display:none} aside .userbox{border:none;padding:0;margin-left:auto}
  main{padding:20px 16px 50px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<section id="login">
  <div class="card-login">
    <div class="brandmark"><span class="dot"></span><h1>ControlMantenimiento</h1></div>
    <p class="sub">Gestión de inventario y mantenimiento técnico</p>
    <div class="field">
      <label>Correo</label>
      <input id="email" type="email" autocomplete="username" placeholder="usuario@institucion.edu" />
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
    </div>
    <button class="btn block" id="btnLogin">Ingresar</button>
    <div style="text-align:center;margin-top:14px">
      <button class="linkbtn" id="btnToggleSignup">¿No tenés cuenta? Registrate</button>
    </div>
    <div id="loginMsg"></div>
  </div>
</section>

<!-- ===================== APP ===================== -->
<div id="app">
  <aside>
    <div class="brandmark"><span class="dot"></span><h1>Control<br>Mantenimiento</h1></div>
    <nav class="side" id="nav">
      <button data-sec="dashboard" class="active"><span class="ic">◧</span>Panel</button>
      <button data-sec="mant"><span class="ic">✚</span>Mantenimientos</button>
      <button data-sec="pc"><span class="ic">▣</span>PCs</button>
      <button data-sec="imp"><span class="ic">⎙</span>Impresoras</button>
      <button data-sec="sector"><span class="ic">◈</span>Sectores</button>
      <button data-sec="categoria"><span class="ic">⊞</span>Categorías</button>
      <button data-sec="usuario"><span class="ic">☺</span>Usuarios</button>
      <button data-sec="personal"><span class="ic">⚷</span>Personal IT</button>
      <button data-sec="auditoria"><span class="ic">≡</span>Auditoría</button>
    </nav>
    <div class="spacer"></div>
    <div class="userbox">
      <div class="email" id="userEmail">—</div>
      <button class="btn ghost sm block" id="btnLogout" style="color:#cfd9e4;border-color:rgba(255,255,255,.18)">Cerrar sesión</button>
    </div>
  </aside>

  <main id="content"><!-- render dinámico --></main>
</div>

<!-- modal genérico -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhead"><h3 id="modalTitle">Título</h3><button class="x" id="modalClose">×</button></div>
    <div class="mbody" id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   CONFIGURACIÓN  ->  COMPLETAR con los datos de tu proyecto
   Supabase Dashboard -> Project Settings -> API
   ============================================================ */
const SUPABASE_URL  = "https://cywychcllnfkdygnfjde.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5d3ljaGNsbG5ma2R5Z25mamRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNzYxMTksImV4cCI6MjA5NTg1MjExOX0.5QdUNHO46wLI-Xk_UndWGR3GJLzxTHYKai3BAPrRZHE";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* ---------- estado global ---------- */
let currentUser = null;            // { id, email }
const $ = (s,el=document)=>el.querySelector(s);

/* ---------- helpers UI ---------- */
function toast(msg, isErr=false){
  const t=$("#toast"); t.textContent=msg; t.className=isErr?"err show":"show";
  setTimeout(()=>t.className=isErr?"err":"",2600);
}
function esc(s){return (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fdate(d){ if(!d) return "—"; const x=new Date(d); return x.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function estadoPill(e){
  const map={"Activo":"ok","Activa":"ok","En Reparación":"warn","De Baja":"bad","En Depósito":"idle"};
  return `<span class="pill ${map[e]||"idle"}">${esc(e)}</span>`;
}
function openModal(title, html){ $("#modalTitle").textContent=title; $("#modalBody").innerHTML=html; $("#overlay").classList.add("show"); }
function closeModal(){ $("#overlay").classList.remove("show"); }
$("#modalClose").onclick=closeModal;
$("#overlay").onclick=e=>{ if(e.target.id==="overlay") closeModal(); };

/* manejo de errores de Supabase con mensaje amable */
function dbError(error){
  let m=error.message||"Error desconocido";
  if(/row-level security|violates row-level/i.test(m))
    m="Tu usuario no tiene rol técnico/admin para esta acción.";
  if(/chk_activo_coherente/i.test(m)) m="El tipo de activo no coincide con el equipo seleccionado.";
  if(/uq_consumible/i.test(m)) m="Ya existe un insumo de ese tipo y color en esta impresora.";
  if(/nombre_categoria/i.test(m)) m="Ya existe una categoría con ese nombre.";
  if(/duplicate key|numero_serie|etiqueta_patrimonial/i.test(m)) m="Ya existe un equipo con ese número de serie o etiqueta.";
  toast(m,true); console.error(error);
}

/* ============================================================
   AUTENTICACIÓN
   ============================================================ */
let signupMode=false;
$("#btnToggleSignup").onclick=()=>{
  signupMode=!signupMode;
  $("#btnLogin").textContent=signupMode?"Crear cuenta":"Ingresar";
  $("#btnToggleSignup").textContent=signupMode?"Ya tengo cuenta, ingresar":"¿No tenés cuenta? Registrate";
  $("#loginMsg").innerHTML="";
};
$("#btnLogin").onclick=async()=>{
  const email=$("#email").value.trim(), password=$("#password").value;
  if(!email||!password){ $("#loginMsg").innerHTML='<div class="msg err">Completá correo y contraseña.</div>'; return; }
  $("#btnLogin").disabled=true;
  const fn = signupMode ? sb.auth.signUp({email,password}) : sb.auth.signInWithPassword({email,password});
  const {data,error}=await fn;
  $("#btnLogin").disabled=false;
  if(error){ $("#loginMsg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
  if(signupMode && !data.session){
    $("#loginMsg").innerHTML='<div class="msg ok">Cuenta creada. Si pide confirmación, revisá tu correo y luego ingresá.</div>';
    return;
  }
  // onAuthStateChange se encarga de mostrar la app
};
$("#btnLogout").onclick=async()=>{ await sb.auth.signOut(); };

sb.auth.onAuthStateChange((_e,session)=>{
  if(session?.user){
    currentUser={id:session.user.id,email:session.user.email};
    $("#userEmail").textContent=currentUser.email;
    $("#login").style.display="none";
    $("#app").style.display="grid";
    route("dashboard");
  }else{
    currentUser=null;
    $("#app").style.display="none";
    $("#login").style.display="grid";
    $("#password").value="";
  }
});

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
$("#nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-sec]"); if(!b) return;
  route(b.dataset.sec);
});
function route(sec){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.sec===sec));
  ({dashboard:renderDashboard,mant:renderMant,pc:renderPC,imp:renderImp,
    sector:renderSector,categoria:renderCategoria,usuario:renderUsuario,personal:renderPersonal,auditoria:renderAuditoria}[sec]||renderDashboard)();
}

/* ============================================================
   PANEL (dashboard)
   ============================================================ */
async function renderDashboard(){
  const c=$("#content");
  c.innerHTML=`<div class="head"><div><h2>Panel</h2><div class="lead">Resumen del estado actual</div></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="panel"><div class="tbar"><h3>Últimos mantenimientos</h3>
      <button class="btn accent sm" onclick="route('mant')">＋ Registrar</button></div>
      <div id="dashTable"></div></div>`;
  const [pc,imp,mant,rep]=await Promise.all([
    sb.from("inventario_pc").select("id",{count:"exact",head:true}),
    sb.from("inventario_impresora").select("id",{count:"exact",head:true}),
    sb.from("registro_mantenimiento").select("id",{count:"exact",head:true}),
    sb.from("inventario_pc").select("id",{count:"exact",head:true}).eq("estado","En Reparación"),
  ]);
  // impresoras con algún insumo crítico (<20%)
  let criticas=0;
  const cons=await sb.from("inventario_impresora").select("id,consumible_impresora(nivel_porcentaje)");
  if(!cons.error){
    criticas=(cons.data||[]).filter(i=>(i.consumible_impresora||[])
      .some(c=>c.nivel_porcentaje!=null && c.nivel_porcentaje<20)).length;
  }
  $("#kpis").innerHTML=`
    ${kpi(pc.count,"PCs")}${kpi(imp.count,"Impresoras")}
    ${kpi(mant.count,"Mantenimientos",true)}${kpi(rep.count,"En reparación")}
    ${kpi(criticas,"Insumos críticos",criticas>0)}`;
  const {data,error}=await sb.from("registro_mantenimiento")
    .select("fecha,tipo_activo,tipo_mantenimiento,descripcion_detalle,inventario_pc(numero_serie),inventario_impresora(numero_serie),categoria_tarea(nombre_categoria)")
    .order("fecha",{ascending:false}).limit(8);
  if(error) return dbError(error);
  $("#dashTable").innerHTML=tableHTML(
    ["Fecha","Activo","Tipo","Equipo","Categoría","Detalle"],

/* borrado genérico con confirmación y mensaje amable si la base lo rechaza */
async function borrar(tabla, id, etiqueta, recargar){
  if(!confirm(`¿Eliminar ${etiqueta}? Esta acción no se puede deshacer.`)) return;
  const {error}=await sb.from(tabla).delete().eq("id",id);
  if(error){
    if(/violates foreign key|still referenced/i.test(error.message))
      toast("No se puede eliminar: tiene registros asociados. Cambiá el estado a «De Baja».",true);
    else dbError(error);
    return;
  }
  toast("Eliminado"); recargar();
}

/* ============================================================
   PCs  +  MOTOR DE VALORACIÓN (0-100)
   ============================================================ */
const VAL_FULL=8.33, VAL_MED=4.16;       // puntos por criterio (12 x 8.33 ≈ 100)
function aniosDesde(f){ if(!f) return Infinity; const d=new Date(f); return isNaN(d)?Infinity:(Date.now()-d)/(31557600000); }
function calcValoracion(p){
  const d=[]; const add=(c,pts)=>d.push({c,pts:Math.round(pts*100)/100});
  add("CPU",        p.gama_cpu==="Alta"?VAL_FULL:p.gama_cpu==="Media"?VAL_MED:0);
  const dt=(p.disco_tipo||"").toLowerCase();
  add("Disco",      /nvme|m\.?2/.test(dt)?VAL_FULL:/ssd/.test(dt)?VAL_MED:0);
  add("Gráfica",    p.gama_gpu==="Dedicada"?VAL_FULL:p.gama_gpu==="Integrada"?VAL_MED:0);
  add("Fuente",     p.fuente_80plus==="Certificada"?VAL_FULL:p.fuente_80plus==="De marca"?VAL_MED:0);
  add("Salud disco",p.salud_disco!=null&&p.salud_disco!==""?(Number(p.salud_disco)/100)*VAL_FULL:0);
  add("RAM",        p.ram_gb>=16?VAL_FULL:p.ram_gb>=8?VAL_MED:0);
  const so=(p.sistema_operativo||"").toLowerCase();
  add("S.O.",       /11/.test(so)?VAL_FULL:/10/.test(so)?VAL_MED:0);
  add("Protección", p.tipo_proteccion==="UPS"?VAL_FULL:p.tipo_proteccion==="Estabilizador"?VAL_MED:0);
  add("Monitor",    p.monitor_pulgadas>=19?VAL_FULL:p.monitor_pulgadas>=17?VAL_MED:0);
  const ab=aniosDesde(p.fecha_bios);     add("BIOS",     ab<=2?VAL_FULL:ab<=5?VAL_MED:0);
  const marcas=["asrock","msi","asus","gigabyte","biostar","evga"]; const mb=(p.motherboard||"").toLowerCase();
  add("Mother",     marcas.some(m=>mb.includes(m))?VAL_FULL:mb.trim()?VAL_MED:0);
  const af=aniosDesde(p.fecha_ultimo_formateo); add("Formateo", af<=1?VAL_FULL:af<=3?VAL_MED:0);
  const total=Math.round(d.reduce((s,x)=>s+x.pts,0)*10)/10;
  return {total, nivel: total>=85?"Óptimo":total>=65?"Medio":"Crítico", desglose:d};
}
function nivelPill(n,pts){
  const cls=n==="Óptimo"?"ok":n==="Medio"?"warn":n==="Crítico"?"bad":"idle";
  return n?`<span class="pill ${cls}">${esc(n)}${pts!=null?` · ${pts}`:""}</span>`:'<span class="pill idle">—</span>';
}

async function savePC(id){

  if(!row.marca||!row.modelo||!row.numero_serie){ toast("Marca, modelo y nº de serie son obligatorios.",true); return; }

  row.valoracion_puntos=val.total; row.valoracion_nivel=val.nivel;
  if(!id) row.id_responsable_it=currentUser.id;   // al crear, responsable = usuario actual
  const {error}= id
    ? await sb.from("inventario_pc").update(row).eq("id",id)
    : await sb.from("inventario_pc").insert(row);
  if(error) return dbError(error);
  closeModal(); toast(id?`PC actualizada · ${val.nivel} (${val.total})`:`PC agregada · ${val.nivel} (${val.total})`); renderPC();
}

async function saveImp(id){
  const row={
    marca:$("#i_marca").value.trim(), modelo:$("#i_modelo").value.trim(),
    numero_serie:$("#i_serie").value.trim(), etiqueta_patrimonial:$("#i_etiq").value.trim()||null,
    tecnologia:$("#i_tec").value, tipo:$("#i_tipo").value, color:$("#i_color").value,
    conexion:$("#i_con").value, modelo_toner:$("#i_toner").value.trim()||null,
    direccion_ip:$("#i_ip").value.trim()||null, id_sector:Number($("#i_sector").value)||null,
    estado:$("#i_estado").value
  };
  if(!id) row.id_responsable_it=currentUser.id;
  if(!row.marca||!row.modelo||!row.numero_serie){ toast("Marca, modelo y nº de serie son obligatorios.",true); return; }
  const {error}= id
    ? await sb.from("inventario_impresora").update(row).eq("id",id)
    : await sb.from("inventario_impresora").insert(row);

/* ============================================================
   INSUMOS DE IMPRESORA  (tóner / tinta / tambor)
   ============================================================ */
let insImpId=null;          // impresora activa en el modal
function nivelClass(p){ return p==null?"idle":(p>=50?"ok":(p>=20?"warn":"bad")); }
// Indicador para la fila: muestra el nivel más bajo si hay alguno por debajo del umbral
function insumoAlerta(lista){
  const niveles=(lista||[]).map(c=>c.nivel_porcentaje).filter(n=>n!=null);
  if(!niveles.length) return `<span class="pill idle" title="Sin insumos cargados">—</span>`;
  const min=Math.min(...niveles);
  if(min<20)  return `<span class="pill bad"  title="Insumo crítico">⚠ ${min}%</span>`;
  if(min<50)  return `<span class="pill warn" title="Insumo bajo">${min}%</span>`;
  return `<span class="pill ok" title="Niveles correctos">OK</span>`;
}
function nivelBar(p){
  const v=p==null?0:p;
  return `<div class="track"><div class="fill ${nivelClass(p)}" style="width:${v}%"></div></div>`;
}
function colorChip(c){ const cls=(c||"NA").replace("/","").replace(/\s/g,""); return `<span class="cdot c-${cls==='N/A'?'NA':cls}"></span>`; }

async function verInsumos(idImp,nombre){
  insImpId=idImp;
  openModal("Insumos · "+nombre, `<div id="insList" class="empty">Cargando…</div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
      <button class="btn ghost sm" onclick="formInsumo()">＋ Agregar insumo</button>
    </div>`);
  await loadInsumos();
}
async function loadInsumos(){
  const {data,error}=await sb.from("consumible_impresora")
    .select("id,tipo,color,codigo,nivel_porcentaje,rendimiento_paginas")
    .eq("id_impresora",insImpId)
    .order("tipo").order("color");
  if(error){ $("#insList").innerHTML=`<div class="empty">${esc(error.message)}</div>`; return; }
  if(!data.length){ $("#insList").innerHTML=`<div class="empty">Sin insumos cargados.</div>`; return; }
  $("#insList").innerHTML=data.map(c=>`
    <div class="ins-row">
      <div>
        <div class="ins-lbl">${colorChip(c.color)}${esc(c.tipo)}${c.color&&c.color!=='N/A'?' · '+esc(c.color):''}</div>
        <div class="ins-sub">${c.rendimiento_paginas?('Rinde '+c.rendimiento_paginas+' pág.'):'&nbsp;'}</div>
      </div>
      <input class="mono" id="cod_${c.id}" value="${esc(c.codigo||'')}" placeholder="código"/>
      <div class="nivel">
        ${nivelBar(c.nivel_porcentaje)}
        <input type="number" id="niv_${c.id}" value="${c.nivel_porcentaje??''}" min="0" max="100"/>
        <span class="pctsign">%</span>
      </div>
      <button class="iconbtn" title="Guardar" onclick="saveInsumo(${c.id})">✓</button>
      <button class="iconbtn danger" title="Eliminar" onclick="delInsumo(${c.id})">✕</button>
    </div>`).join("");
}
async function saveInsumo(id){
  const codigo=$("#cod_"+id).value.trim()||null;
  let niv=$("#niv_"+id).value; niv = niv===""?null:Math.max(0,Math.min(100,Number(niv)));
  const {error}=await sb.from("consumible_impresora").update({codigo,nivel_porcentaje:niv}).eq("id",id);
  if(error) return dbError(error);
  toast("Insumo actualizado"); loadInsumos();
}
async function delInsumo(id){
  if(!confirm("¿Eliminar este insumo?")) return;
  const {error}=await sb.from("consumible_impresora").delete().eq("id",id);
  if(error) return dbError(error);
  toast("Insumo eliminado"); loadInsumos();
}
function formInsumo(){
  openModal("Agregar insumo",`
    <div class="grid2">
      <div class="field"><label>Tipo</label>
        <select id="ci_tipo"><option>Tóner</option><option>Tinta</option><option>Tambor</option><option>Otro</option></select></div>
      <div class="field"><label>Color / canal</label>
        <select id="ci_color"><option>Negro</option><option>Cyan</option><option>Magenta</option><option>Amarillo</option><option>Tricolor</option><option>N/A</option></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Código de parte</label><input id="ci_cod" class="mono" placeholder="ej. TN-3479"/></div>
      <div class="field"><label>Nivel (%)</label><input id="ci_niv" type="number" min="0" max="100" placeholder="ej. 100"/></div>
    </div>
    <div class="field"><label>Rendimiento (páginas, opcional)</label><input id="ci_rend" type="number" placeholder="ej. 3000"/></div>
    <div class="mfoot">
      <button class="btn ghost" onclick="verInsumosReopen()">Volver</button>
      <button class="btn accent" onclick="saveNuevoInsumo()">Agregar</button>
    </div>`);
}
async function verInsumosReopen(){ // reabre la lista sin perder la impresora activa
  openModal("Insumos", `<div id="insList" class="empty">Cargando…</div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
      <button class="btn ghost sm" onclick="formInsumo()">＋ Agregar insumo</button></div>`);
  await loadInsumos();
}
async function saveNuevoInsumo(){
  let niv=$("#ci_niv").value; niv = niv===""?null:Math.max(0,Math.min(100,Number(niv)));
  const row={
    id_impresora:insImpId, tipo:$("#ci_tipo").value, color:$("#ci_color").value,
    codigo:$("#ci_cod").value.trim()||null, nivel_porcentaje:niv,
    rendimiento_paginas:Number($("#ci_rend").value)||null
  };
  const {error}=await sb.from("consumible_impresora").insert(row);
  if(error) return dbError(error);   // captura el UNIQUE (mismo tipo+color repetido)
  toast("Insumo agregado"); verInsumosReopen();
}

               `borrarCategoria(${r.id},'${esc(r.nombre_categoria).replace(/'/g,"\\'")}')`)]));
}
async function borrarCategoria(id,nombre){
  const {count}=await sb.from("registro_mantenimiento").select("id",{count:"exact",head:true}).eq("id_categoria_tarea",id);
  const aviso = count>0
    ? `\n\n${count} mantenimiento(s) usan esta categoría y quedarán "sin categoría". El historial NO se borra.`
    : "";
  if(!confirm(`¿Eliminar la categoría «${nombre}»?${aviso}`)) return;
  const {error}=await sb.from("categoria_tarea").delete().eq("id",id);
  if(error) return dbError(error);
  toast("Categoría eliminada"); renderCategoria();
}
function formCategoria(id=null,nombre=""){
  openModal(id?"Editar categoría":"Nueva categoría",`

async function saveCategoria(id){
